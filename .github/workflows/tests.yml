name: Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest pytest-asyncio homeassistant pytest-homeassistant-custom-component
      - run: python -m pytest
      - run: python -m compileall -q custom_components tests
      - run: node --check custom_components/home_energy_intelligence/frontend/hei-panel.js
  browser-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright
      - run: node tests/overview_layout_check.cjs
        env:
          HEI_CHROME: /usr/bin/google-chrome
      - run: node tests/temperature_cop_layout_check.cjs
        env:
          HEI_CHROME: /usr/bin/google-chrome
